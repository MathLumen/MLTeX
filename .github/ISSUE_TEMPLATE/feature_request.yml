name: Feature Request
description: Suggest a new feature or improvement.
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Before submitting, check that no existing issue covers this idea.
        **Note:** MLTeX is intentionally client-side only — proposals requiring a backend will not be accepted.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the pain point or limitation you are running into.
      placeholder: "When I type long equations, I can't see the cursor easily because..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to see added or changed?
      placeholder: "Add a 'focus mode' that hides the toolbar and expands the editor pane..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other approaches you thought about?

  - type: checkboxes
    id: constraints
    attributes:
      label: Constraints check
      options:
        - label: This feature works fully client-side (no server, no external API required).
          required: true
        - label: This feature does not require new heavy dependencies (>50 kB gzipped).

  - type: dropdown
    id: priority
    attributes:
      label: How important is this to you?
      options:
        - Nice to have
        - Would significantly improve my workflow
        - Blocking me from using MLTeX

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Mockups, links to prior art, related issues, etc.
